<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTECHLAB | Grid ID Printer Pro v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f2f5; padding: 20px; text-align: center; margin: 0; }
        
        /* --- UI STYLES --- */
        .no-print { 
            background: white; padding: 25px; border-radius: 16px; 
            display: inline-block; margin-bottom: 20px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            position: sticky; top: 10px; z-index: 100; border: 1px solid #e2e8f0;
            max-width: 950px;
        }
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; text-align: left; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 0.65rem; font-weight: 800; color: #64748b; text-transform: uppercase; }
        input[type="number"], select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; }
        
        .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .btn-sync { background: #6366f1; color: white; }
        .btn-print { background: #10b981; color: white; }

        /* --- PAPER & GRID SETUP (Short Bond 8.5x11in) --- */
        .paper {
            width: 21.59cm; 
            height: 27.94cm;
            background: white;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 9.5cm 9.5cm;
            grid-template-rows: 13cm 13cm;
            gap: 5mm; 
            padding: 1cm;
            box-sizing: border-box;
            justify-content: center;
            align-content: start;
            page-break-after: always;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .id-slot {
            width: 9.5cm;
            height: 13cm;
            border: 1px dashed #ccc;
            position: relative;
            background-size: 100% 100%;
            overflow: hidden;
            background-color: #fafafa;
        }

        .id-name {
            position: absolute;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
            color: #000;
            white-space: nowrap;
        }

        @media print {
            @page { size: letter; margin: 0; }
            body { background: none; padding: 0; }
            .no-print { display: none; }
            .paper { box-shadow: none; margin: 0; border: none; }
            .id-slot { border: none; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h2 style="color:#1e293b; margin-bottom:5px;">🖨️ Grid ID Batch Printer</h2>
        <p style="color:#64748b; font-size:0.85rem;">4 IDs per Page | Batch-Specific Full Name Logic</p>
        
        <div class="controls">
            <div class="control-group">
                <label>1. Select Batch</label>
                <select id="batchSelect">
                    <option value="batch1">Batch 1</option>
                    <option value="batch2">Batch 2</option>
                    <option value="batch3">Batch 3</option>
                </select>
            </div>
            <div class="control-group">
                <label>2. ID Template</label>
                <input type="file" id="tplInput" accept="image/*">
            </div>
            <div class="control-group">
                <label>3. Actions</label>
                <div style="display:flex; gap:5px;">
                    <button onclick="fetchData()" class="btn btn-sync">Sync</button>
                    <button onclick="window.print()" class="btn btn-print">Print</button>
                </div>
            </div>

            <div class="control-group">
                <label>Name Top (Vertical %)</label>
                <input type="number" id="nameTop" value="45">
            </div>
            <div class="control-group">
                <label>Name Left (Horizontal %)</label>
                <input type="number" id="nameLeft" value="50">
            </div>
            <div class="control-group">
                <label>Font Size (PX)</label>
                <input type="number" id="nameSize" value="40">
            </div>
            <div class="control-group">
                <label>Reset Settings</label>
                <button onclick="location.reload()" style="padding:8px; border-radius:8px; border:1px solid #ddd; cursor:pointer;">Reset All</button>
            </div>
        </div>
    </div>

    <div id="printContainer"></div>

    <script>
        const BATCH_URLS = {
            'batch1': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRbCq73MJLutPIdiSHMtsLgzvzE0QrPOJuHC2CPbb8B1H0Yi3Ewije4kqdwLEvR8Fc9X1mf0dqh4nAb/pub?gid=2111996398&single=true&output=csv',
            'batch2': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRbCq73MJLutPIdiSHMtsLgzvzE0QrPOJuHC2CPbb8B1H0Yi3Ewije4kqdwLEvR8Fc9X1mf0dqh4nAb/pub?gid=1002419209&single=true&output=csv',
            'batch3': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRbCq73MJLutPIdiSHMtsLgzvzE0QrPOJuHC2CPbb8B1H0Yi3Ewije4kqdwLEvR8Fc9X1mf0dqh4nAb/pub?gid=801337014&single=true&output=csv'
        };

        let participants = [];
        let templateImg = "";

        document.getElementById('tplInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                templateImg = event.target.result;
                refreshPreview();
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // Sync Data with Emergency Batch 1 Logic
        async function fetchData() {
            const batch = document.getElementById('batchSelect').value;
            const syncBtn = document.querySelector('.btn-sync');
            syncBtn.innerText = "⌛ Syncing...";
            
            try {
                const response = await fetch(BATCH_URLS[batch] + `&t=${Date.now()}`);
                const csv = await response.text();
                const rows = csv.split(/\r?\n/).slice(1);
                
                participants = rows.map(row => {
                    // Split while ignoring commas inside quotes
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (cols && cols.length > 0) {
                        let fullName = cols[0].replace(/"/g, '').trim();
                        
                        /* EMERGENCY LOGIC FOR BATCH 1: 
                           If it's Batch 1 AND column 2 is NOT a number (Age), 
                           join Col 1 and Col 2 together. */
                        if (batch === 'batch1' && cols[1] && isNaN(cols[1].trim())) {
                            fullName += " " + cols[1].replace(/"/g, '').trim();
                        }

                        return { name: fullName.toUpperCase() };
                    }
                    return null;
                }).filter(p => p && p.name !== "" && p.name !== "FULL NAME");

                refreshPreview();
                syncBtn.innerText = "Sync";
            } catch (err) { 
                alert("Failed to sync sheet data."); 
                syncBtn.innerText = "Sync";
            }
        }

        function refreshPreview() {
            const container = document.getElementById('printContainer');
            container.innerHTML = ''; 

            const nTop = document.getElementById('nameTop').value;
            const nLeft = document.getElementById('nameLeft').value;
            const nSize = document.getElementById('nameSize').value;

            let currentPage;
            
            participants.forEach((p, index) => {
                if (index % 4 === 0) {
                    currentPage = document.createElement('div');
                    currentPage.className = 'paper';
                    container.appendChild(currentPage);
                }

                const slot = document.createElement('div');
                slot.className = 'id-slot';
                if(templateImg) slot.style.backgroundImage = `url('${templateImg}')`;

                slot.innerHTML = `
                    <div class="id-name" style="
                        top:${nTop}%; 
                        left:${nLeft}%; 
                        font-size:${nSize}px; 
                        font-weight:800;
                    ">
                        ${p.name}
                    </div>
                `;
                currentPage.appendChild(slot);
            });
        }

        // Apply real-time preview to inputs
        ['nameTop', 'nameLeft', 'nameSize'].forEach(id => {
            document.getElementById(id).addEventListener('input', refreshPreview);
        });
    </script>
</body>
</html>
